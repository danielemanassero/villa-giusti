<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Giusti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar con Burger Menu -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">

                <img src="images/villa_giusti_logo.png" alt="Villa Giusti Logo" />
            </div>
            <button class="burger-menu" id="burgerMenu" aria-label="Menu">
                <span></span>
                <span></span>

            <ul class="nav-menu">

                <li><a href="#chi-siamo" class="nav-link">CHI SIAMO</a></li>
                <li><a href="#camere" class="nav-link">LE CAMERE</a></li>
                <li><a href="#servizi" class="nav-link">SERVIZI</a></li>

    <section id="chi-siamo" class="section">

            <p>Contenuto della seconda sezione</p>
        </div>

    <!-- Sezione 3 -->
    <section id="servizi" class="section">
        <div class="section-content">
            <h2>Servizi</h2>
            <p>Contenuto della terza sezione</p>
        </div>
    </section>

    <!-- Sezione 4 -->
    <section id="contatti" class="section">
        <div class="section-content">
            <h2>Contatti</h2>
            <p>Contenuto della quarta sezione</p>
        </div>
    </section>

    <script src="script.js"></script>
