<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: same slate-blue as the site header -->
  <rect width="64" height="64" rx="10" fill="#5F7389"/>

  <!-- Logo mark: outlined square frame merging into a solid block on the right,
       reproducing the Villa Giusti header icon -->
  <g>
    <!-- outline frame -->
    <rect x="12" y="12" width="40" height="40" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <!-- solid block covering the right portion of the frame -->
    <rect x="34" y="12" width="18" height="40" fill="#FFFFFF"/>
  </g>
</svg>
